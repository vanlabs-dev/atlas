<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comp F: Strata as an instrument</title>

<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090a;--s1:#0f1113;--s2:#15181b;--rule:#1d1f22;--tx:#f2f3f5;--tx2:#a3a8b1;--tx3:#7d838d;--ac:#5d93ff;--ac2:#a8c8ff;--dn:#f0646a;
  --gut:clamp(16px,4vw,64px);--max:1600px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 "Schibsted Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.disp{font-family:Newsreader,Georgia,serif;font-optical-sizing:auto;font-weight:500}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
a{color:inherit}

/* header: wordmark and the four boards; the block clock now lives on the field */
header{position:relative;z-index:3}
header .wrap{display:flex;align-items:center;height:72px;gap:36px;flex-wrap:wrap}
.wm{font-family:Newsreader,serif;font-size:24px;font-weight:500;letter-spacing:-.01em;text-decoration:none}
header nav{display:flex;gap:28px}
header nav a{color:var(--tx2);text-decoration:none;font-size:15px;transition:color .15s}
header nav a:hover{color:var(--tx)}

/* hero: the field is the picture; copy sits in the quiet layers at the top */
.hero{position:relative;height:min(100svh,980px);min-height:760px;margin-top:-72px}
canvas#field{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.copy{position:relative;z-index:2;padding-top:148px;max-width:var(--max);margin:0 auto;padding-left:var(--gut);padding-right:var(--gut);pointer-events:none}
.copy>*{pointer-events:auto;max-width:880px}
.copy::before{content:"";position:absolute;z-index:-1;left:-20%;top:60px;width:min(1200px,90%);height:calc(100% + 40px);pointer-events:none;
  background:radial-gradient(closest-side,rgba(8,9,10,.94),rgba(8,9,10,.8) 55%,transparent)}
h1{font-size:clamp(48px,6.4vw,112px);line-height:.95;letter-spacing:-.028em}
.sub{font-size:22px;line-height:1.45;color:var(--tx2);margin-top:28px;max-width:40ch}
.sub b{color:var(--tx);font-weight:500}
.acts{display:flex;gap:28px;align-items:center;margin-top:36px}
.b1{height:48px;padding:0 22px;display:inline-flex;align-items:center;background:var(--tx);color:var(--bg);border-radius:4px;font-weight:500;text-decoration:none;transition:background .15s}
.b1:hover{background:var(--ac2)}
.b2{text-decoration:none;font-weight:500;border-bottom:1px solid var(--tx3);padding-bottom:2px;transition:border-color .15s}
.b2:hover{border-color:var(--tx)}

/* instrument furniture, absolutely placed by script */
.ax{position:absolute;z-index:2;font-size:12px;color:var(--tx3);white-space:nowrap;pointer-events:none}
.ax.today{color:var(--ac2)}
.ax b{font-weight:500;color:var(--tx2)}
.clock{display:flex;gap:10px;align-items:baseline}
.clock i{display:inline-block;width:40px;height:2px;background:var(--rule);position:relative;top:-3px;overflow:hidden}
.clock i::after{content:"";position:absolute;inset:0;background:var(--ac);transform-origin:left;transform:scaleX(var(--p,0))}
.band{position:absolute;z-index:2;font-size:12px;color:var(--tx3);pointer-events:none;line-height:1.35}

/* the callout: an annotation pinned to a row, not a card */
.note{position:absolute;z-index:3;pointer-events:none;transition:opacity .15s}
.note .lead{position:absolute;border:solid var(--ac2);border-width:0 1px 1px 0;opacity:.7}
.note .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--ac2);transform:translate(-50%,-50%)}
.note .tag{position:absolute;padding:0;min-width:300px}
.note .nm{font-family:Newsreader,serif;font-weight:500;font-size:40px;line-height:1}
.note .id{display:block;font-size:13px;color:var(--ac2);margin-bottom:8px}
.note .why{font-size:16px;color:var(--tx2);margin-top:8px;max-width:30ch}
.note dl{display:flex;gap:28px;margin-top:14px}
.note dt{font-size:12px;color:var(--tx3);white-space:nowrap}
.note dd{font-size:22px}

/* fleet section with the fixed type scale: 13 / 16 / 20 / 28 / 64 */
.board{padding:160px 0 140px}
.bgrid{display:grid;grid-template-columns:4fr 8fr;gap:72px;align-items:start}
.bh{font-size:clamp(40px,4.4vw,64px);line-height:1;letter-spacing:-.02em}
.bf{color:var(--tx2);font-size:20px;line-height:1.45;margin-top:20px;max-width:30ch}
.nums{margin-top:56px;display:grid;gap:24px}
.nums div{display:grid;grid-template-columns:112px 1fr;align-items:baseline;gap:16px}
.nums dd{font-family:Newsreader,serif;font-size:64px;line-height:.9}
.nums dt{color:var(--tx2);font-size:16px}
table{width:100%;border-collapse:collapse;font-size:16px}
th{font-weight:400;font-size:13px;color:var(--tx3);text-align:left;padding:0 14px 14px;white-space:nowrap}
td{padding:16px 14px;border-top:1px solid var(--rule);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s}tbody tr:hover td{background:var(--s1)}
td.n span{color:var(--tx3);margin-right:10px;display:inline-block;min-width:2ch;text-align:right}
td.why{color:var(--tx2)}
.r{text-align:right}
.dn{color:var(--dn)}.up{color:var(--ac2)}
.lane{display:block;height:16px;width:150px;margin-left:auto}
.more{display:inline-block;margin-top:32px;font-weight:500;text-decoration:none;border-bottom:1px solid var(--tx3);padding-bottom:2px}

@media (max-width:900px){
  header .wrap{height:auto;padding-top:18px;padding-bottom:6px;row-gap:12px}
  .hero{height:auto;min-height:0;margin-top:0;display:flex;flex-direction:column}
  canvas#field{position:relative;inset:auto;height:440px;order:2}
  .copy{padding-top:44px;padding-bottom:32px;order:1}
  .sub{font-size:19px}
  .note{position:relative!important;left:auto!important;top:auto!important;order:3;margin:12px var(--gut) 0}
  .note .lead,.note .dot{display:none}
  .note .tag{position:relative;left:auto!important;top:auto!important;box-shadow:none;background:var(--s1);border-radius:10px;padding:16px 18px}
  .ax,.band{display:none}
  .ax.m{display:block}
  .bgrid{grid-template-columns:1fr;gap:48px}
  .hide{display:none}
  .lane{width:90px}
  .board{padding:96px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const s=(v,d=0,u="")=>v==null?"-":(v>0?"+":v<0?"−":"")+f(Math.abs(v),d)+u;

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const DAYS=90, N=128;

document.getElementById("sub").innerHTML=`Code, chain and market, from one Raspberry Pi at home. In the last 30 days it read <b>${f(D.commits30)} commits</b> across <b>${D.repos} repositories</b>.`;

// Rows sorted like sediment: no code and quiet at the top, busiest at the bottom.
const byRow=Object.fromEntries(D.rows.map(r=>[r.netuid,r]));
const slots=D.activity.map(a=>({n:a.n,d:a.d,c30:a.d?sum(a.d.slice(-30)):null,c7:a.d?sum(a.d.slice(-7)):null,r:byRow[a.n]}));
slots.sort((a,b)=>(a.d?1:0)-(b.d?1:0)||(a.c30??0)-(b.c30??0)||(a.d&&b.d?sum(a.d)-sum(b.d):0));
const order=new Map(slots.map((x,i)=>[x.n,i]));
const nNull=slots.filter(x=>!x.d).length, nZero=slots.filter(x=>x.d&&x.c30===0).length;

const cv=document.getElementById("field"),cx=cv.getContext("2d"),hero=cv.parentElement;
let G, sel=order.get(D.lead), hover=-1, reveal=reduce?1:0, flash=0, knock=null;

function geom(){
  const W=cv.clientWidth,H=cv.clientHeight,mobile=W<900;
  const left=0,right=W-(mobile?16:Math.max(140,W*.09)),top=mobile?8:88,bottom=H-(mobile?28:56);
  return {W,H,mobile,left,right,top,bottom,rh:(bottom-top)/N,cw:(right-left)/DAYS};
}
// light smoothing for the band variant: a 5-day triangle kernel
function smooth(d){const k=[1,2,3,2,1],o=new Float32Array(DAYS);for(let i=0;i<DAYS;i++){let a=0,w=0;for(let j=-2;j<=2;j++){const x=i+j;if(x<0||x>=DAYS)continue;a+=d[x]*k[j+2];w+=k[j+2]}o[i]=a/w}return o}
const smoothed=slots.map(x=>x.d?smooth(x.d):null);
const amp=v=>Math.min(1,Math.log1p(v)/2.6);

function draw(){
  const g=G=geom(); const {W,H,left,right,top,rh,cw}=g;
  cx.clearRect(0,0,W,H);
  const xmax=left+(right-left)*reveal;
  cx.save();cx.beginPath();cx.rect(0,0,xmax,H);cx.clip();
  for(let i=0;i<N;i++){
    const x=slots[i],y=top+i*rh+rh/2,on=i===sel||i===hover,head=x.r&&x.r.tier==="head";
    // baseline of every stratum; dotted where Atlas cannot read any code
    if(!x.d){cx.fillStyle="rgba(255,255,255,.07)";for(let px=left;px<right;px+=6)cx.fillRect(px,y,1.5,1);continue}
    cx.fillStyle=on?"rgba(168,200,255,.22)":"rgba(255,255,255,.035)";cx.fillRect(left,y-.5,right-left,1);
    const col=a=>on?`rgba(168,200,255,${.4+a*.6})`:head?`rgba(93,147,255,${.35+a*.65})`:`rgba(214,218,226,${.14+a*.5})`;
    if(V==="dashes"){
      for(let d=0;d<DAYS;d++){const v=x.d[d];if(!v)continue;const a=amp(v);cx.fillStyle=col(a);
        const mh=Math.max(1,rh*.78*a);cx.fillRect(left+d*cw+1,y-mh/2,Math.max(1,cw-2),mh)}
    }else{
      const sm=smoothed[i],th=d=>sm[d]>0.05?Math.max(.6,rh*.9*amp(sm[d])):0;
      cx.fillStyle=col(.55);cx.beginPath();cx.moveTo(left,y);
      for(let d=0;d<DAYS;d++)cx.lineTo(left+(d+.5)*cw,y-th(d)/2);
      cx.lineTo(right,y);
      for(let d=DAYS-1;d>=0;d--)cx.lineTo(left+(d+.5)*cw,y+th(d)/2);
      cx.closePath();cx.fill();
    }
  }
  cx.restore();
  // knock the field out behind the annotation so it reads cleanly
  if(knock&&!g.mobile){cx.clearRect(knock.x-20,knock.y-16,knock.w+40,knock.h+32)}
  // today: the edge every block seals
  if(reveal>=1){cx.fillStyle=`rgba(168,200,255,${.55+flash*.45})`;cx.fillRect(right,top-24,1+flash*1.5,g.bottom-top+24)}
  // time axis
  cx.fillStyle="rgba(255,255,255,.12)";cx.fillRect(left,g.bottom+10,right-left,1);
  for(const d of [0,30,60]){cx.fillRect(left+d*cw,g.bottom+6,1,9)}
  place();
}

// furniture: axis dates, today label with the block clock, band labels
const fur=document.getElementById("furniture");
const day=i=>{const t=new Date(Date.parse(D.anchorAt)-(DAYS-1-i)*864e5);return t.toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"})};
function place(){
  const g=G;
  fur.innerHTML=[
    ...[[0,"90 days ago"],[30,"60 days ago"],[60,"30 days ago"]].map(([d,l])=>`<span class="ax" style="left:${g.left+d*g.cw+6}px;top:${g.bottom+18}px">${day(d)} <span style="opacity:.7">${l}</span></span>`),
    `<span class="ax today" style="left:${g.right-80}px;top:${g.bottom+18}px;width:80px;text-align:right">${day(DAYS-1)}</span>`,
    `<span class="ax today clock" style="left:${g.right+12}px;top:${g.top-30}px">today</span>`,
    `<span class="ax clock" style="left:${g.right+12}px;top:${g.top-10}px">est. block <b id="blk"></b></span>`,
    `<span class="ax clock" style="left:${g.right+12}px;top:${g.top+10}px"><i id="bar"></i></span>`,
    `<span class="band" style="left:${g.right+12}px;top:${g.top+nNull*g.rh/2-8}px">${nNull} with no code<br>Atlas can read</span>`,
    `<span class="band" style="left:${g.right+12}px;top:${g.top+(nNull+nZero/2)*g.rh-8}px">${nZero} silent<br>for 30 days</span>`,
    `<span class="band" style="left:${g.right+12}px;top:${g.bottom-g.rh*6-8}px;color:var(--tx2)">busiest</span>`,
  ].join("");
  note();
}

// the annotation, pinned to the selected or hovered row
const nt=document.getElementById("note");
let px=null;
function note(){
  const g=G,i=hover>=0?hover:sel,x=slots[i],r=x.r,y=g.top+i*g.rh+g.rh/2;
  const at=px==null?g.right-g.cw*2.5:Math.min(g.right,Math.max(g.left+40,px));
  const tag=nt.querySelector(".tag");
  tag.innerHTML=`<span class="id">Subnet ${x.n}</span><div class="nm">${r?r.name:"SN"+x.n}</div>
    <p class="why">${r?`${WHY[r.why]||r.why}. ${TIER[r.tier][0].toUpperCase()+TIER[r.tier].slice(1)}.`:x.d?"Atlas reads its code. Not on the fleet board.":"No public repository Atlas can read."}</p>
    <dl><div><dt>Commits, 7 d</dt><dd>${x.c7??"-"}</dd></div><div><dt>Commits, 30 d</dt><dd>${f(x.c30)}</dd></div>${r?`<div><dt>Price, 30 d</dt><dd class="${r.momentum30d<0?"dn":"up"}">${s(r.momentum30d,1,"%")}</dd></div>`:""}</dl>`;
  if(g.mobile){nt.style.opacity=1;return}
  const tw=tag.offsetWidth,th=tag.offsetHeight;
  // the tag lives in the quiet layers above the field's floor; a line drops to the row
  const tx=Math.min(g.right-tw-24,Math.max(g.W*.62,at-tw-24)), ty=g.top+Math.round((g.bottom-g.top)*.24);
  const lx=tx+tw+12, ly=ty+18;
  nt.style.left="0px";nt.style.top="0px";
  nt.querySelector(".dot").style.cssText=`left:${at}px;top:${y}px`;
  const lead=nt.querySelector(".lead");
  if(at>=lx){lead.style.cssText=`left:${lx}px;top:${ly}px;width:${at-lx}px;height:${y-ly}px;border-width:1px 1px 0 0`}
  else{lead.style.cssText=`left:${at}px;top:${ly}px;width:${lx-at}px;height:${y-ly}px;border-width:1px 0 0 1px`}
  tag.style.left=tx+"px";tag.style.top=ty+"px";
  const k={x:tx,y:ty,w:tw,h:th};
  if(!knock||knock.x!==k.x||knock.y!==k.y||knock.w!==k.w||knock.h!==k.h){knock=k;requestAnimationFrame(draw)}
  nt.style.opacity=reveal>=1?1:0;
}
function rowAt(e){const r=cv.getBoundingClientRect(),g=G;const i=Math.floor((e.clientY-r.top-g.top)/g.rh);return i>=0&&i<N&&e.clientX-r.left<=g.right?i:-1}
cv.addEventListener("mousemove",e=>{const i=rowAt(e);px=i>=0?e.clientX-cv.getBoundingClientRect().left:null;if(i!==hover){hover=i;draw()}else note()});
cv.addEventListener("mouseleave",()=>{hover=-1;px=null;draw()});
cv.addEventListener("click",e=>{const i=rowAt(e);if(i>=0){sel=i;draw()}});

function size(){const dpr=Math.min(2,devicePixelRatio||1);cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener("resize",size);size();

// one load moment: the 90 days replay left to right, then the field settles
if(!reduce){const t0=performance.now();(function go(t){reveal=Math.min(1,(t-t0)/1400);reveal=1-(1-reveal)**3;draw();if(reveal<1)requestAnimationFrame(go)})(t0)}

// block clock: every 12 s the today edge flares
const b0=Date.parse(D.blockAt);let last=-1;
(function tick(){const el=(Date.now()-b0)/12000,n=Math.floor(el);const blk=document.getElementById("blk");if(blk)blk.textContent=f(D.block+n);
  const bar=document.getElementById("bar");if(bar)bar.style.setProperty("--p",reduce?0:(el%1).toFixed(3));
  if(n!==last&&last!==-1&&!reduce){const s0=performance.now();(function fl(t){const p=Math.min(1,(t-s0)/600);flash=(1-p)**2;draw();if(p<1)requestAnimationFrame(fl)})(s0)}
  last=n;setTimeout(tick,250)})();

// fleet section
document.getElementById("bf").textContent=`${D.counts.diverging} subnets show code and price moving 40 points or more apart. ${byRow[D.lead].name} leads.`;
document.getElementById("nums").innerHTML=[[D.counts.diverging,"code and price apart"],[D.counts.cold,"gone cold this month"],[D.counts.emission,"emission routes changed"],[D.counts.invisible,"with no public repository"]].map(([v,k])=>`<div><dd>${v}</dd><dt>${k}</dt></div>`).join("");
const top8=D.rows.slice(0,8);
document.getElementById("rows").innerHTML=top8.map(r=>`<tr><td class="n"><span>${r.netuid}</span>${r.name}</td><td class="r">${r.score}</td><td class="why hide">${WHY[r.why]||r.why}</td><td class="r hide">${f(r.commits30)}</td><td class="r ${r.momentum30d<0?"dn":"up"}">${s(r.momentum30d,1,"%")}</td><td><canvas class="lane" data-n="${r.netuid}"></canvas></td></tr>`).join("");
document.querySelectorAll("canvas.lane").forEach(c=>{const x=slots[order.get(+c.dataset.n)],dpr=2,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
  const cw=w/30;for(let d=0;d<30;d++){const v=x.d?x.d[DAYS-30+d]:0;const a=v?amp(v):0;g.fillStyle=a?`rgba(168,200,255,${.3+a*.7})`:"rgba(255,255,255,.08)";const bh=a?Math.max(2,h*a):1;g.fillRect(d*cw,(h-bh)/2,Math.max(1,cw-1.5),bh)}});
</script>
</body>
</html>
